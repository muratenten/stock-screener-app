<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZenStock | クオンツ高勝率スクリーナー</title>

  <!-- PWA & Mobile Web App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-v3.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v3.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512-v3.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="manifest" href="/manifest.json?v=3">

  <!-- iOS / Mobile App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZenStock">
  <meta name="application-name" content="ZenStock">
  <meta name="theme-color" content="#0b0f19">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      position: fixed;
      top: 0;
      left: 0;
    }

    #app-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      background-color: #0b0f19;
    }

    #stream-frame {
      position: absolute;
      top: -34px;
      left: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 82px);
      height: calc(100dvh + 82px);
      border: none;
      outline: none;
      display: block;
      background-color: #0b0f19;
    }

    /* Splash / Loading Screen */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #151d30 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #splash-screen.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.25);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    .splash-title {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      color: #94a3b8;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
    }

    .spinner {
      margin-top: 24px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Bottom Guide Banner for Mobile Safari */
    #ios-pwa-banner {
      display: none;
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      color: #f1f5f9;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .banner-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .banner-text {
      flex: 1;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .banner-text b {
      color: #38bdf8;
      display: block;
      font-size: 0.84rem;
      margin-bottom: 2px;
    }

    .banner-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="/apple-touch-icon-v3.png" alt="ZenStock" class="splash-logo">
    <div class="splash-title">ZenStock</div>
    <div class="splash-subtitle">東証プライム・クオンツ急騰シグナル</div>
    <div class="spinner"></div>
  </div>

  <!-- Main Embedded Streamlit App -->
  <iframe id="stream-frame" src="" allow="clipboard-write; fullscreen"></iframe>
</div>

<!-- Floating Install Prompt for Mobile Safari -->
<div id="ios-pwa-banner">
  <div class="banner-content">
    <img src="/apple-touch-icon-v3.png" alt="ZenStock Icon" class="banner-icon">
    <div class="banner-text">
      <b>ホーム画面に追加してアプリ化</b>
      下部の共有ボタン <svg style="width:14px;height:14px;vertical-align:-2px;fill:currentColor;" viewBox="0 0 24 24"><path d="M16 5l-4-4-4 4h3v9h2V5h3zm4 7v9H4v-9H2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9h-2z"/></svg> ＞「ホーム画面に追加」で専用アイコンとして配置できます
    </div>
    <button class="banner-close" onclick="dismissBanner()">&times;</button>
  </div>
</div>

<script>
  // If opened inside LINE in-app browser, automatically bounce to external browser (Safari / Chrome)
  // This enables Google OAuth, eliminates in-app warning banner, and allows adding to home screen
  const isLine = /Line\//i.test(navigator.userAgent);
  if (isLine && !window.location.search.includes("openExternalBrowser=1")) {
    const sep = window.location.href.includes("?") ? "&" : "?";
    window.location.href = window.location.href + sep + "openExternalBrowser=1";
  }

  // Check if running in standalone PWA mode
  const isStandalone = window.navigator.standalone === true || 
                       window.matchMedia('(display-mode: standalone)').matches;

  // Set Iframe Target URL pointing directly to the unwrapped Streamlit instance (/~/+/)
  const BASE_APP_URL = "https://stock-screener-app-crrzltcyekqdt7uulhgpaa.streamlit.app/~/+/";
  const searchParams = window.location.search;
  let targetUrl = BASE_APP_URL;
  if (searchParams) {
    targetUrl += searchParams.startsWith("?") ? searchParams : ("?" + searchParams);
  }

  const iframe = document.getElementById("stream-frame");
  const splash = document.getElementById("splash-screen");

  iframe.src = targetUrl;

  iframe.onload = function() {
    // Smooth transition
    setTimeout(function() {
      splash.classList.add("loaded");
    }, 600);
  };

  // Fallback splash dismissal after 4 seconds
  setTimeout(function() {
    splash.classList.add("loaded");
  }, 4000);

  // Show installation prompt only if on iOS Safari and NOT standalone
  const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
  const bannerDismissed = localStorage.getItem("zenstock_pwa_banner_dismissed");

  if (isIos && !isStandalone && !bannerDismissed) {
    setTimeout(function() {
      document.getElementById("ios-pwa-banner").style.display = "block";
    }, 1500);
  }

  function dismissBanner() {
    document.getElementById("ios-pwa-banner").style.display = "none";
    localStorage.setItem("zenstock_pwa_banner_dismissed", "true");
  }

  // Register service worker for first-class Android PWA installation
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

</body>
</html>
