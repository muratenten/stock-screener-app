name: Weekly TSE Fundamentals Cache Update

on:
  schedule:
    # Runs at 18:00 UTC every Saturday (03:00 JST Sunday / Saturday midnight)
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Run fundamentals cache updater
        run: |
          python update_fundamentals_cache.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tse_fundamentals_cache.json
          git commit -m "chore(auto): weekly fundamentals cache update (JST Saturday midnight) [skip ci]" || echo "No changes to commit"
          git push origin main
